<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive!</p>
        </header>

        <main class="todo-card">

            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter a new task..." autocomplete="off">

                <button id="addTaskBtn">Add Task</button>
            </div>

            <div class="task-info">
                <h2>My Tasks</h2>
                <span id="taskCount">0 Tasks</span>
            </div>

            <div class="task-stats">
                <div class="stat-box">
                    <h3 id="totalTasks">0</h3>
                    <p>Total</p>
                </div>
                <button id="clearCompletedBtn" class="clear-btn">
                    Clear Completed Tasks
                </button>

                <div class="stat-box">
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>

                <div class="stat-box">
                    <h3 id="pendingTasks">0</h3>
                    <p>Pending</p>
                </div>
            </div>

            <ul id="taskList">
                <!-- Tasks will appear here -->
            </ul>

            <p id="emptyMessage">No tasks yet. Add your first task!</p>

        </main>

        <footer>
            <p>Developed as part of CodeOrbit Tech Full Stack Development Internship</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
